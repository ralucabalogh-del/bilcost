kind = "web"
previewPath = "/"
title = "Bilcost"
version = "1.0.0"
id = "artifacts/bilcost"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 4200

[services.development]
run = "pnpm --filter @workspace/bilcost run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bilcost", "run", "build" ]
publicDir = "artifacts/bilcost/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "4200"
BASE_PATH = "/"
